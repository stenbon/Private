name: Dzen Auto Publisher
concurrency:
  group: dzen-publisher
  cancel-in-progress: false
on:
  # 14.08.2026: ОТКЛЮЧЕНО по требованию пользователя. Обнаружено, что этот
  # облачный пайплайн (dzen_publisher.py, groq/compound) дублирует основной
  # пайплайн app.py на VPS (185.17.3.67, cron 01:00/10:00/19:00 МСК, Gemini) —
  # оба читают из одного SHEET_ID и пишут на один и тот же WP_URL, расписания
  # пересекаются (19:00 МСК у обоих) => риск повторного задвоения статей,
  # как это уже было 8-11.08.2026 (12 задвоенных постов на Дзене).
  # Расписание закомментировано ниже. Ручной запуск (workflow_dispatch)
  # оставлен для тестов — не запускается сам по себе.
  # - cron: '0 23 * * *'   # 02:00 МСК
  # - cron: '0 6 * * *'    # 09:00 МСК
  # - cron: '0 16 * * *'   # 19:00 МСК
  workflow_dispatch:        # ручной запуск через кнопку в GitHub

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests python-dotenv gspread google-auth

      - name: Run publisher
        env:
          WP_URL:               ${{ secrets.WP_URL }}
          WP_USER:              ${{ secrets.WP_USER }}
          WP_APP_PASS:          ${{ secrets.WP_APP_PASS }}
          WP_CATEGORY:          ${{ secrets.WP_CATEGORY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS:   ${{ secrets.GOOGLE_CREDENTIALS }}
          FAL_API_KEY:          ${{ secrets.FAL_API_KEY }}
        run: python dzen_publisher.py
