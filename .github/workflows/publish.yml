name: Dzen Auto Publisher
concurrency:
  group: dzen-publisher
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish.yml"]
  schedule:
    # Слоты синхронизированы с 000l-dzen-daily-batch (02:00/09:00/19:00 МСК = UTC+3)
    - cron: '0 23 * * *'   # 02:00 МСК
    - cron: '0 6 * * *'    # 09:00 МСК
    - cron: '0 16 * * *'   # 19:00 МСК
  workflow_dispatch:        # ручной запуск через кнопку в GitHub

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests python-dotenv gspread google-auth

      - name: Run publisher
        env:
          WP_URL:               ${{ secrets.WP_URL }}
          WP_USER:              ${{ secrets.WP_USER }}
          WP_APP_PASS:          ${{ secrets.WP_APP_PASS }}
          WP_CATEGORY:          ${{ secrets.WP_CATEGORY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS:   ${{ secrets.GOOGLE_CREDENTIALS }}
          FAL_API_KEY:          ${{ secrets.FAL_API_KEY }}
        run: python dzen_publisher.py
